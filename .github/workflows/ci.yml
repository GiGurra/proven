name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run unit tests (no toolexec)
        run: go test ./internal/... ./pkg/...

      - name: Run unit tests with -race
        run: go test -race ./internal/... ./pkg/...

      - name: Run e2e fixtures (internal harness manages its own toolexec builds)
        run: go test ./internal/preprocessor/...

      - name: Install proven binary
        run: go install ./cmd/proven/

      - name: Run toolexec build on examples
        run: |
          # go clean -cache wipes whichever cache $GOCACHE points at,
          # so set our proven-test GOCACHE before cleaning.
          GOCACHE="$HOME/.cache/proven-build" go clean -cache
          GOFLAGS="-toolexec=proven" GOCACHE="$HOME/.cache/proven-build" go build ./example/...

      - name: Run toolexec build on benchmark corpus
        run: |
          GOCACHE="$HOME/.cache/proven-corpus" go clean -cache
          cd benchmarks/corpus
          GOFLAGS="-toolexec=proven" GOCACHE="$HOME/.cache/proven-corpus" go build ./...

      - name: Run bench runner
        run: |
          cd benchmarks/bench
          go run .
