name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          check-latest: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run unit tests (no toolexec)
        run: go test ./internal/... ./pkg/...

      - name: Run unit tests with -race
        run: go test -race ./internal/... ./pkg/...

      - name: Run e2e fixtures (internal harness manages its own toolexec builds)
        run: go test ./internal/preprocessor/...

      - name: Install proven binary
        run: go install ./cmd/proven/

      - name: Run toolexec build on examples
        run: |
          # go clean -cache wipes whichever cache $GOCACHE points at,
          # so set our proven-test GOCACHE before cleaning.
          GOCACHE="$HOME/.cache/proven-build" go clean -cache
          GOFLAGS="-toolexec=proven" GOCACHE="$HOME/.cache/proven-build" go build ./example/...

      - name: Run toolexec build on benchmark corpus
        run: |
          GOCACHE="$HOME/.cache/proven-corpus" go clean -cache
          cd benchmarks/corpus
          GOFLAGS="-toolexec=proven" GOCACHE="$HOME/.cache/proven-corpus" go build ./...

      - name: Run bench runner
        run: |
          cd benchmarks/bench
          go run .

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Generate version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Calculate new version — increment patch version
          IFS='.' read -r major minor patch <<< "${LATEST_TAG/v/}"
          NEW_VERSION="v$major.$minor.$((patch+1))"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Creating new version: $NEW_VERSION"

      - name: Create tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: Release ${{ steps.version.outputs.new_version }}
          generate_release_notes: true
