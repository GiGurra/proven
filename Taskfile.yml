version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  install:
    desc: Install the proven binary
    cmds:
      - go install ./cmd/proven/

  test:
    desc: Run all tests (pkg/proventest supplies the linker stub; e2e harness owns its GOCACHE)
    cmds:
      - go test ./... -count=1

  test:unit:
    desc: Run fast unit + wiring tests, skipping the e2e fixture harness
    cmds:
      - go test ./pkg/... ./example/... -count=1
      - go test ./internal/preprocessor/ -skip '^(TestFixtures|TestChainAndThen_)' -count=1

  test:e2e:
    desc: Run the e2e fixture harness (builds cmd/proven and runs every testdata/cases/* fixture)
    cmds:
      - go test ./internal/preprocessor/ -run '^(TestFixtures|TestChainAndThen_)' -count=1

  clean:
    desc: Remove build artifacts
    cmds:
      - go clean ./...
